# Redmi 8: modules that must NOT load by themselves.
#   msm                    olive-gpu.service loads it GPU-only
#                          (separate_gpu_kms=1); the DSI display path does
#                          not bring the panel up and would take the screen.
#   leds_lm3697 + common   the backlight chip is a KTD3137; the LM3697 driver
#                          resets it and the screen goes dark.
#   panel_ili9881hplus_c3i DSI panel driver, only useful with msm display.
#   ili9881h_tddi          touch driver that waits for that DSI panel;
#                          ili9881h-tddi-fb replaces it.
blacklist msm
blacklist panel_ili9881hplus_c3i
blacklist ili9881h_tddi
blacklist leds_lm3697
blacklist leds_ti_lmu_common
