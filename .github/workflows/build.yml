# The README's build steps on a fresh Ubuntu 24.04 machine, with exactly the
# host packages the README lists: proves the build works on plain Linux.
# Nothing is published; on a failure the end of the log becomes annotations
# (job logs need a login, annotations do not).
name: build

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'scripts/build/**'
      - 'device/**'
      - 'image/**'
      - 'firmware/**'
      - 'scripts/ci/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: kernel, lk2nd and userdata image
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WORK: /mnt/redmi8-build
    steps:
      - uses: actions/checkout@v7

      - name: Host packages (as listed in the README)
        run: |
          df -h / /mnt
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make clang lld llvm bc bison flex libssl-dev libelf-dev \
            python3 zstd debootstrap qemu-user-static binfmt-support e2fsprogs \
            openssl curl fdisk gcc-arm-none-eabi device-tree-compiler python3-libfdt
          sudo install -d -o "$USER" "$WORK"

      - name: scripts/build/build-kernel.sh
        run: |
          set -o pipefail
          scripts/build/build-kernel.sh 2>&1 | tee /tmp/kernel.log | grep -E '^===|KERNEL_OK|error' || true
          test -f "$WORK/kernel/vmlinuz"
          ls "$WORK/kernel/modules/lib/modules/"*/extra

      - name: image/build-image.sh
        env:
          IMAGE_PASSWORD: ci-only-not-a-real-password
        run: |
          set -o pipefail
          sudo -E KERNEL_DIR="$WORK/kernel" WORK=/mnt/redmi8-image OUT=/mnt/image-out \
            image/build-image.sh 2>&1 | tee /tmp/image.log

      - name: Logs
        if: failure()
        run: |
          [ -f /tmp/image.log ] && python3 scripts/ci/annotate_tail.py /tmp/image.log build-image.sh \
            || python3 scripts/ci/annotate_tail.py /tmp/kernel.log build-kernel.sh

      - name: Check the images
        run: |
          cd /mnt/image-out && ls -l && sha256sum -c SHA256SUMS
          head -c 8 lk2nd.img | grep -q 'ANDROID!'
          sudo apt-get install -y -qq android-sdk-libsparse-utils
          sudo simg2img userdata.img /mnt/userdata.raw
          dev=$(sudo losetup -fP --show /mnt/userdata.raw)
          sudo e2fsck -fn "${dev}p1"
          sudo e2fsck -fn "${dev}p2"
          sudo mkdir -p /mnt/b /mnt/r
          sudo mount -o ro "${dev}p1" /mnt/b && sudo mount -o ro "${dev}p2" /mnt/r
          cat /mnt/b/extlinux/extlinux.conf
          ls -l /mnt/b/ubuntu
          test -f /mnt/r/usr/sbin/gdm3
          test -L /mnt/r/lib && test -e /mnt/r/lib/ld-linux-aarch64.so.1
          ls /mnt/r/usr/lib/modules/*/extra
          test ! -e /mnt/r/etc/ssh/ssh_host_ed25519_key
          sudo grep -q '^root:[!*]' /mnt/r/etc/shadow
          sudo umount /mnt/b /mnt/r && sudo losetup -d "$dev"

      - name: First boot in a VM (scripts/ci/vm-boot-test.sh)
        env:
          IMAGE_PASSWORD: ci-only-not-a-real-password
          HOSTNAME_EXPECTED: redmi8
          # these need the phone's partitions, its USB gadget and its device tree
          DEVICE_UNITS: msm-firmware-loader.service olive-net.service olive-autoconfirm.service
          # the Wi-Fi fix waits for wlan0, then attaches; mac80211_hwsim is a
          # virtual Wi-Fi card
          EXTRA_CHECKS: |
            systemctl start wpa_supplicant.service
            sleep 15
            check "olive-wifi-noht waits for wlan0 without restarting" test \
              "$(systemctl is-active olive-wifi-noht.service)/$(systemctl show -p NRestarts --value olive-wifi-noht.service)" = active/0
            modprobe mac80211_hwsim radios=1
            for i in $(seq 1 30); do [ -S /run/wpa_supplicant/wlan0 ] && break; sleep 2; done
            sleep 5
            check "olive-wifi-noht attaches wpa_cli once wlan0 is up" pgrep -x wpa_cli
            check "olive-wifi-noht still has not restarted" \
              test "$(systemctl show -p NRestarts --value olive-wifi-noht.service)" = 0
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm sshpass zstd
          set -o pipefail
          sudo -E scripts/ci/vm-boot-test.sh /mnt/userdata.raw vda2 2>&1 | tee /tmp/vm.log

      - name: VM log
        if: failure()
        run: |
          if [ -f /tmp/vm.log ]; then
            python3 scripts/ci/annotate_tail.py /tmp/vm.log vm-boot-test.sh
          fi
